<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>P-BANDAI</title>
    <script src="https://cdn.jsdelivr.net/npm/react@18/umd/react.production.min.js"></script>
    <script>
        // Product data loaded via JavaScript API
        var productData = {
            id: 'F2434385006',
            name: 'HGUC 1/144 ガンダムエクシア',
            sku: 'HGUC 1/144 GN-001 Gundam Exia',
            price: 2200,
            description: 'ハイグレード 1/144 ガンダムエクシア',
            images: [
                'https://p-bandai.com/images/hguc-exia-01.jpg',
                'https://p-bandai.com/images/hguc-exia-02.jpg'
            ],
            specifications: {
                scale: '1/144',
                height: '125mm',
                parts: '約250個'
            }
        };
    </script>
</head>
<body>
    <div id="root">
        <!-- Content will be dynamically loaded -->
        <div class="loading">Loading product data...</div>
        <div id="product-container" style="display: none;">
            <!-- Product content will be inserted here -->
        </div>
    </div>
    <script>
        // Simulate dynamic content loading
        setTimeout(function() {
            var container = document.getElementById('product-container');
            var loading = document.querySelector('.loading');

            // Create product elements safely
            var titleElement = document.createElement('h1');
            titleElement.textContent = productData.name;

            var skuElement = document.createElement('div');
            skuElement.className = 'sku';
            skuElement.textContent = productData.sku;

            var priceElement = document.createElement('div');
            priceElement.className = 'price';
            priceElement.textContent = '¥' + productData.price;

            var descElement = document.createElement('p');
            descElement.textContent = productData.description;

            // Append elements safely
            container.appendChild(titleElement);
            container.appendChild(skuElement);
            container.appendChild(priceElement);
            container.appendChild(descElement);

            // Show content, hide loading
            loading.style.display = 'none';
            container.style.display = 'block';
        }, 1000);
    </script>
</body>
</html>
