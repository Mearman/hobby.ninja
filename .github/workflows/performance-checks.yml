name: Performance Checks and Optimization

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  schedule:
    # Run performance checks daily at 2 AM UTC
    - cron: '0 2 * * *'

jobs:
  bundle-size:
    name: Bundle Size Analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build application
        run: yarn build

      - name: Analyze bundle size
        run: |
          # Install bundle analyzer
          npm install -g bundlesize

          # Create bundlesize config
          cat > .bundlesize.json << EOF
          {
            "files": [
              {
                "path": "./dist/apps/webapp/assets/index-*.js",
                "maxSize": "250kb",
                "compression": "gzip"
              },
              {
                "path": "./dist/apps/webapp/assets/vendor-*.js",
                "maxSize": "200kb",
                "compression": "gzip"
              },
              {
                "path": "./dist/apps/webapp/assets/*.css",
                "maxSize": "50kb",
                "compression": "gzip"
              }
            ]
          }
          EOF

          # Run bundle size analysis
          bundlesize

      - name: Upload bundle reports
        uses: actions/upload-artifact@v4
        with:
          name: bundle-reports
          path: dist/apps/webapp/stats.html
          retention-days: 30

  lighthouse-audit:
    name: Lighthouse Performance Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build application
        run: yarn build

      - name: Start application
        run: |
          # Serve the built application
          npx serve -s dist/apps/webapp -l 3000 &
          sleep 10

      - name: Run Lighthouse CI
        run: |
          npm install -g @lhci/cli@0.12.x
          lhci autorun
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}
          LHCI_SERVER_URL: https://lhci.herokuapp.com
          LHCI_SERVER_BASE_URL: https://lhci.herokuapp.com

  performance-tests:
    name: Load Testing
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build application
        run: yarn build

      - name: Start application
        run: |
          npx serve -s dist/apps/webapp -l 3000 &
          sleep 10

      - name: Install k6
        run: |
          sudo gpg -k
          sudo gpg --no-default-keyring --keyring /usr/share/keyrings/k6-archive-keyring.gpg --keyserver hkp://keyserver.ubuntu.com:80 --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update
          sudo apt-get install k6

      - name: Run load tests
        env:
          APP_URL: http://localhost:3000
        run: |
          # Create k6 test script with safe environment variables
          cat > load-test.js << 'EOF'
          import http from 'k6/http';
          import { check, sleep } from 'k6';
          import { Rate } from 'k6/metrics';

          let errorRate = new Rate('errors');

          export let options = {
            stages: [
              { duration: '2m', target: 10 },
              { duration: '5m', target: 10 },
              { duration: '2m', target: 50 },
              { duration: '5m', target: 50 },
              { duration: '2m', target: 0 },
            ],
            thresholds: {
              http_req_duration: ['p(95)<500'],
              http_req_failed: ['rate<0.1'],
              errors: ['rate<0.1'],
            },
          };

          export default function() {
            let response = http.get(__ENV.APP_URL || 'http://localhost:3000', {
              tags: { name: 'homepage' },
            });

            let success = check(response, {
              'status is 200': (r) => r.status === 200,
              'response time < 500ms': (r) => r.timings.duration < 500,
            });

            errorRate.add(!success);
            sleep(1);
          }
          EOF

          # Run the load test
          k6 run load-test.js --out json=load-test-results.json

      - name: Upload load test results
        uses: actions/upload-artifact@v4
        with:
          name: load-test-results
          path: load-test-results.json
          retention-days: 30

  performance-regression:
    name: Performance Regression Detection
    runs-on: ubuntu-latest
    needs: [bundle-size, lighthouse-audit]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Analyze performance changes
        run: |
          # Create performance summary
          cat > performance-summary.md << 'EOF'
          # Performance Analysis Summary

          ## Bundle Size Analysis
          - Initial JavaScript bundle: Target < 250KB
          - Vendor bundle: Target < 200KB
          - CSS bundle: Target < 50KB
          - Total bundle: Target < 300KB

          ## Core Web Vitals Targets
          - LCP (Largest Contentful Paint): < 2.5s
          - FID (First Input Delay): < 100ms
          - CLS (Cumulative Layout Shift): < 0.1
          - FCP (First Contentful Paint): < 1.8s
          - TTFB (Time to First Byte): < 800ms

          ## Recommendations
          - Implement code splitting for non-critical routes
          - Optimize images with WebP format
          - Use tree shaking for unused dependencies
          - Enable Brotli compression
          - Implement service worker caching
          EOF

          # Upload summary
          mkdir -p reports
          cp performance-summary.md reports/

      - name: Upload performance summary
        uses: actions/upload-artifact@v4
        with:
          name: performance-summary
          path: reports/
          retention-days: 30

      - name: Comment PR with performance results
        if: github.event_name == 'pull_request'
        env:
          COMMIT_SHA: ${{ github.sha }}
          REPO_NAME: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.number }}
          RUN_ID: ${{ github.run_id }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          COMMENT_BODY="## 🚀 Performance Analysis

          Bundle size analysis completed for commit $COMMIT_SHA.

          ## Core Web Vitals Targets
          - LCP (Largest Contentful Paint): < 2.5s
          - FID (First Input Delay): < 100ms
          - CLS (Cumulative Layout Shift): < 0.1
          - FCP (First Contentful Paint): < 1.8s
          - TTFB (Time to First Byte): < 800ms

          View detailed results in the Actions tab."

          gh pr comment $PR_NUMBER --body "$COMMENT_BODY"

  cache-optimization:
    name: Cache Analysis and Optimization
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build with cache analysis
        run: |
          # Build with Vite's built-in analysis
          yarn build

          # Analyze npm package cache
          npm cache verify

          # Check yarn cache efficiency
          yarn cache dir

      - name: Generate cache report
        run: |
          mkdir -p cache-reports

          # Generate dependency analysis
          npx depcheck > cache-reports/dependency-check.txt 2>&1 || true

          # Create cache optimization recommendations
          cat > cache-reports/cache-recommendations.md << 'EOF'
          # Cache Optimization Recommendations

          ## Build Cache
          - Enable Nx distributed caching for CI/CD
          - Configure Vite build cache properly
          - Use Yarn Plug'n'Play for faster installs

          ## Browser Cache
          - Implement proper Cache-Control headers
          - Use content hashes for file names
          - Enable HTTP/2 Server Push for critical resources

          ## Service Worker Cache
          - Cache critical resources on first load
          - Implement stale-while-revalidate for API calls
          - Use background sync for offline scenarios
          EOF

      - name: Upload cache reports
        uses: actions/upload-artifact@v4
        with:
          name: cache-reports
          path: cache-reports/
          retention-days: 30

  notify-results:
    name: Notify Performance Results
    runs-on: ubuntu-latest
    needs: [bundle-size, lighthouse-audit, performance-tests, performance-regression, cache-optimization]
    if: always()

    steps:
      - name: Create comprehensive report
        env:
          BUNDLE_RESULT: ${{ needs.bundle-size.result }}
          LIGHTHOUSE_RESULT: ${{ needs.lighthouse-audit.result }}
          LOAD_TEST_RESULT: ${{ needs.performance-tests.result }}
          REGRESSION_RESULT: ${{ needs.performance-regression.result }}
          CACHE_RESULT: ${{ needs.cache-optimization.result }}
        run: |
          cat > comprehensive-performance-report.md << EOF
          # Comprehensive Performance Report

          Generated on: $(date)
          Commit: $GITHUB_SHA
          Branch: $GITHUB_REF

          ## 📊 Status Summary
          - Bundle Size: $BUNDLE_RESULT
          - Lighthouse Audit: $LIGHTHOUSE_RESULT
          - Load Tests: $LOAD_TEST_RESULT
          - Performance Regression: $REGRESSION_RESULT
          - Cache Optimization: $CACHE_RESULT

          ## 🎯 Performance Score
          Overall build status: ${{ job.status }}

          ## 📋 Recommendations
          Based on the results, consider implementing the following optimizations:
          1. Bundle size optimization
          2. Image compression and WebP conversion
          3. Service worker caching improvements
          4. Code splitting enhancements
          EOF

      - name: Upload comprehensive report
        uses: actions/upload-artifact@v4
        with:
          name: comprehensive-performance-report
          path: comprehensive-performance-report.md
          retention-days: 90