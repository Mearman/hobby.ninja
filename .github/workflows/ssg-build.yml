name: SSG Build and Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 2 * * *"

jobs:
  validate:
    name: Validate Code
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm nx typecheck web

      - name: Lint
        run: pnpm nx lint web

      - name: Test
        run: pnpm nx test web --ci

  build:
    name: Build Static Pages
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build SSG
        run: pnpm nx build:ssg

      - name: Verify Build
        run: |
          echo "Verifying SSG build output..."

          # Check if critical files exist
          if [ ! -f "dist/apps/web/index.html" ]; then
            echo "❌ index.html not found"
            exit 1
          fi

          if [ ! -f "dist/apps/web/sitemap.xml" ]; then
            echo "❌ sitemap.xml not found"
            exit 1
          fi

          if [ ! -f "dist/apps/web/robots.txt" ]; then
            echo "❌ robots.txt not found"
            exit 1
          fi

          HTML_COUNT=$(find dist/apps/web -name "*.html" -type f | wc -l)
          echo "✅ Generated $HTML_COUNT HTML pages"

          # Verify critical routes exist
          CRITICAL_ROUTES=0
          for route in "/brand/30mm" "/category/gunpla" "/item/01_1000"; do
            if [ -f "dist/apps/web${route}.html" ]; then
              echo "✅ ${route}.html generated"
              CRITICAL_ROUTES=$((CRITICAL_ROUTES + 1))
            fi
          done

          echo "✅ $CRITICAL_ROUTES/3 critical routes generated"

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ssg-build
          path: dist/apps/web/
          retention-days: 7

  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/apps/web/

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4