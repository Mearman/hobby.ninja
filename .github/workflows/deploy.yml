name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build job
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build application
        run: pnpm nx build web

      - name: Run tests
        run: pnpm nx test web --codeCoverage

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-files
          path: dist/apps/web/
          retention-days: 1

  # Deploy job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-files
          path: dist/apps/web/

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_path: dist/apps/web

  # Preview job for pull requests
  preview:
    name: Preview Deploy
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'pull_request'

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-files
          path: dist/apps/web/

      - name: Create preview comment
        uses: actions/github-script@v7
        with:
          script: |
            const { data } = await github.rest.repos.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path: `actions/runs/${context.runId}`,
            });

            if (data.conclusion !== 'success') {
              core.setFailed('Build workflow did not complete successfully');
            }

            // Create a preview comment
            const previewUrl = `https://${context.repo.owner}.github.io/${context.repo.repo}/pr-${context.issue.number}`;

            try {
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: `🚀 Preview deployed successfully!\n\nYou can view the preview at: ${previewUrl}`,
              });
            } catch (error) {
              console.error('Failed to create comment:', error);
            }

  # Test job for deployment
  test-deployment:
    name: Test Deployment
    runs-on: ubuntu-latest
    needs: deploy
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'

    steps:
      - name: Wait for deployment
        run: sleep 30

      - name: Test deployment URL
        env:
          DEPLOY_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          # Test that the deployment URL is accessible
          if curl -sf "$DEPLOY_URL/index.html"; then
            echo "✅ Deployment is accessible"
          else
            echo "❌ Deployment is not accessible"
            exit 1
          fi

      - name: Test hash routing
        env:
          DEPLOY_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          # Test hash routing functionality
          if curl -sf "$DEPLOY_URL/#/" && curl -sf "$DEPLOY_URL/#/about"; then
            echo "✅ Hash routing is working"
          else
            echo "❌ Hash routing is not working"
            exit 1
          fi

      - name: Test static assets
        env:
          DEPLOY_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          # Test static assets are loading
          if curl -sf "$DEPLOY_URL/assets/"; then
            echo "✅ Static assets directory is accessible"
          else
            echo "❌ Static assets directory is not accessible"
            exit 1
          fi

          # Test main JS file
          if curl -sf "$DEPLOY_URL/assets/main-"*.js" 2>/dev/null; then
            echo "✅ Main JS file is accessible"
          else
            echo "❌ Main JS file is not accessible"
          fi