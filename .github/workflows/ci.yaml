name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

env:
  NX_CACHE_DIRECTORY: .nx/cache
  NODE_OPTIONS: "--max-old-space-size=8192"

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          sparse-checkout: |
            /*
            !/assets/images
            !/assets/manuals
          sparse-checkout-cone-mode: false

      - name: Free disk space
        run: |
          echo "=== Disk space before cleanup ==="
          df -h /
          echo ""
          echo "=== Removing unnecessary files ==="
          # Remove Android SDK
          sudo rm -rf /usr/local/lib/android || true
          # Remove .NET
          sudo rm -rf /usr/share/dotnet || true
          # Remove Haskell
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /usr/local/.ghcup || true
          # Remove Swift
          sudo rm -rf /usr/share/swift || true
          # Remove Go
          sudo rm -rf /usr/local/go || true
          # Remove CodeQL
          sudo rm -rf /opt/hostedtoolcache/CodeQL || true
          # Remove large tool caches
          sudo rm -rf /opt/hostedtoolcache/Java* || true
          sudo rm -rf /opt/hostedtoolcache/PyPy* || true
          sudo rm -rf /opt/hostedtoolcache/Ruby* || true
          # Clean apt cache
          sudo apt-get clean || true
          # Remove swap
          sudo swapoff -a || true
          sudo rm -f /swapfile || true
          echo ""
          echo "=== Disk space after cleanup ==="
          df -h /

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.0.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Restore Nx cache
        uses: actions/cache@v4
        with:
          path: .nx/cache
          key: nx-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            nx-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
            nx-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm nx typecheck next

      - name: Lint
        run: pnpm nx lint next --fix --quiet || true

      - name: Test
        run: pnpm nx test next --passWithNoTests

      - name: Build Next.js static export
        run: pnpm nx build next

      - name: Verify build output
        run: |
          if [ ! -f "apps/next/out/index.html" ]; then
            echo "Build failed: index.html not found"
            exit 1
          fi
          echo "Build verified successfully"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/next/out

      - name: Clean build output for cache save
        run: |
          echo "=== Cleaning build output to free disk space ==="
          rm -rf apps/next/out apps/next/.next
          df -h /

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
