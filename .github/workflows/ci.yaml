name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  actions: read
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

env:
  NX_CACHE_DIRECTORY: .nx/cache
  NODE_OPTIONS: "--max-old-space-size=8192"
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  prepare-release:
    name: Prepare Release
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    outputs:
      version: ${{ steps.version.outputs.version }}
      should-release: ${{ steps.version.outputs.should-release }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: tree:0
          sparse-checkout: |
            /*
            !/assets/images
            !/assets/manuals
          sparse-checkout-cone-mode: false

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.0.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Get next version
        id: version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Run semantic-release in dry-run mode and capture output
          OUTPUT=$(npx semantic-release --dry-run 2>&1) || true
          echo "$OUTPUT"

          # Extract the next version from output
          NEXT_VERSION=$(echo "$OUTPUT" | grep -oP 'The next release version is \K[0-9]+\.[0-9]+\.[0-9]+' || echo "")

          if [ -n "$NEXT_VERSION" ]; then
            echo "version=$NEXT_VERSION" >> $GITHUB_OUTPUT
            echo "should-release=true" >> $GITHUB_OUTPUT
            echo "Next version will be: $NEXT_VERSION"
          else
            # No release needed, use current version
            CURRENT_VERSION=$(node -p "require('./package.json').version")
            echo "version=$CURRENT_VERSION" >> $GITHUB_OUTPUT
            echo "should-release=false" >> $GITHUB_OUTPUT
            echo "No release needed, using current version: $CURRENT_VERSION"
          fi

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [prepare-release]
    if: always() && (needs.prepare-release.result == 'success' || needs.prepare-release.result == 'skipped')
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: tree:0
          sparse-checkout: |
            /*
            !/assets/images
            !/assets/manuals
          sparse-checkout-cone-mode: false

      - name: Free disk space
        run: |
          echo "=== Disk space before cleanup ==="
          df -h /
          echo ""
          echo "=== Removing unnecessary files ==="
          # Remove Android SDK (~14GB)
          sudo rm -rf /usr/local/lib/android || true
          # Remove .NET (~3GB)
          sudo rm -rf /usr/share/dotnet || true
          # Remove Haskell
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /usr/local/.ghcup || true
          # Remove Swift
          sudo rm -rf /usr/share/swift || true
          # Remove Go
          sudo rm -rf /usr/local/go || true
          # Remove CodeQL (~5GB)
          sudo rm -rf /opt/hostedtoolcache/CodeQL || true
          # Remove large tool caches
          sudo rm -rf /opt/hostedtoolcache/Java* || true
          sudo rm -rf /opt/hostedtoolcache/PyPy* || true
          sudo rm -rf /opt/hostedtoolcache/Ruby* || true
          sudo rm -rf /opt/hostedtoolcache/go || true
          # Remove additional large directories
          sudo rm -rf /usr/share/miniconda || true
          sudo rm -rf /usr/local/share/powershell || true
          sudo rm -rf /usr/local/share/chromium || true
          sudo rm -rf /usr/share/az* || true
          sudo rm -rf /opt/az || true
          sudo rm -rf /opt/microsoft || true
          sudo rm -rf /usr/local/julia* || true
          # Clean Docker images
          docker system prune -af || true
          # Clean apt cache
          sudo apt-get clean || true
          # Remove swap
          sudo swapoff -a || true
          sudo rm -f /swapfile || true
          echo ""
          echo "=== Disk space after cleanup ==="
          df -h /

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.0.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Restore Nx cache
        uses: actions/cache/restore@v4
        with:
          path: .nx/cache
          key: nx-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            nx-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
            nx-${{ runner.os }}-

      - name: Restore Next.js build cache
        uses: actions/cache/restore@v4
        with:
          path: apps/next/.next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('apps/next/**/*.ts', 'apps/next/**/*.tsx') }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
            nextjs-${{ runner.os }}-

      - name: Restore data package cache
        uses: actions/cache/restore@v4
        with:
          path: data/dist
          key: data-${{ runner.os }}-${{ hashFiles('data/src/**/*', 'data/lib/**/*', 'data/scripts/**/*') }}
          restore-keys: |
            data-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Set Nx SHAs
        uses: nrwl/nx-set-shas@v4

      - name: Ensure Next.js cache directory exists
        run: mkdir -p apps/next/.next/cache

      - name: Type check
        run: pnpm nx typecheck next

      - name: Lint
        run: pnpm nx lint next --quiet

      - name: Test
        run: pnpm nx test next --passWithNoTests

      - name: Build Next.js static export
        env:
          NEXT_PUBLIC_APP_VERSION: ${{ needs.prepare-release.outputs.version || '0.0.1' }}
        run: pnpm nx build next -- --turbo

      - name: Verify build output
        run: |
          if [ ! -f "apps/next/out/index.html" ]; then
            echo "Build failed: index.html not found"
            exit 1
          fi
          echo "Build verified successfully"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/next/out

      - name: Clean build output for cache save
        if: always()
        run: |
          echo "=== Cleaning build output to free disk space ==="
          # Keep .next/cache for Next.js build caching, remove the rest
          rm -rf apps/next/out
          find apps/next/.next -mindepth 1 -maxdepth 1 ! -name 'cache' -exec rm -rf {} +
          echo "=== Next.js cache contents ==="
          du -sh apps/next/.next/cache 2>/dev/null || echo "Cache directory empty or missing"
          ls -la apps/next/.next/cache 2>/dev/null || true
          df -h /

      - name: Save Nx cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .nx/cache
          key: nx-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}

      - name: Save Next.js build cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: apps/next/.next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('apps/next/**/*.ts', 'apps/next/**/*.tsx') }}

      - name: Save data package cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/dist
          key: data-${{ runner.os }}-${{ hashFiles('data/src/**/*', 'data/lib/**/*', 'data/scripts/**/*') }}

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  release:
    name: Semantic Release
    runs-on: ubuntu-latest
    needs: [prepare-release, build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && needs.prepare-release.outputs.should-release == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: tree:0
          sparse-checkout: |
            /*
            !/assets/images
            !/assets/manuals
          sparse-checkout-cone-mode: false

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.0.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Semantic Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release
