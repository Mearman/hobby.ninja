name: CodeQL Security Analysis

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]
  schedule:
    # Run security analysis weekly on Sundays at 2 AM UTC
    - cron: '0 2 * * 0'

jobs:
  codeql:
    name: CodeQL Security Analysis
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: ['javascript', 'typescript']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          config-file: ./.github/codeql/codeql-config.yml
          queries: +security-and-quality

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"
          upload: Always
          output: sarif-results

      - name: Upload SARIF file for GitHub Advanced Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: sarif-results/results.sarif

      - name: CodeQL Scanning Summary
        uses: github/codeql-action/analyze-results@v3
        if: always()
        with:
          download_results: true

      - name: Security Scorecard
        uses: ossf/scorecard-action@v2.3.4
        if: github.event_name == 'schedule'
        with:
          results_file: results.scorecard.json
          results_format: json

      - name: Upload Scorecard results
        uses: github/upload-artifact@v4
        if: github.event_name == 'schedule'
        with:
          name: security-scorecard
          path: results.scorecard.json
          retention-days: 30