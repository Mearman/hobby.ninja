# Dependabot Configuration for Automated Dependency Updates
# This file configures automated security updates and version updates

version: 2

# Configure updates for npm packages
updates:
  # Root package.json
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '09:00'
      timezone: 'UTC'
    open-pull-requests-limit: 10
    reviewers:
      - 'dependabot[bot]'
    assignees:
      - 'dependabot[bot]'
    commit-message:
      prefix: 'deps'
      include: 'scope'
    labels:
      - 'dependencies'
      - 'npm'
      - 'automated-update'
    versioning-strategy: 'increase-if-necessary'
    allow:
      - dependency-type: 'all'
    ignore:
      # Ignore major version updates for stability
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
    security-updates: true

  # Apps dependencies
  - package-ecosystem: 'npm'
    directory: '/apps/webapp'
    schedule:
      interval: 'weekly'
      day: 'tuesday'
      time: '09:00'
      timezone: 'UTC'
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'deps'
      include: 'scope'
    labels:
      - 'dependencies'
      - 'npm'
      - 'webapp'
      - 'automated-update'
    versioning-strategy: 'increase-if-necessary'
    security-updates: true

  # Packages dependencies
  - package-ecosystem: 'npm'
    directory: '/packages/types'
    schedule:
      interval: 'weekly'
      day: 'wednesday'
      time: '09:00'
      timezone: 'UTC'
    open-pull-requests-limit: 3
    commit-message:
      prefix: 'deps'
      include: 'scope'
    labels:
      - 'dependencies'
      - 'npm'
      - 'types'
      - 'automated-update'
    versioning-strategy: 'increase-if-necessary'
    security-updates: true

  - package-ecosystem: 'npm'
    directory: '/packages/utils'
    schedule:
      interval: 'weekly'
      day: 'wednesday'
      time: '10:00'
      timezone: 'UTC'
    open-pull-requests-limit: 3
    commit-message:
      prefix: 'deps'
      include: 'scope'
    labels:
      - 'dependencies'
      - 'npm'
      - 'utils'
      - 'automated-update'
    versioning-strategy: 'increase-if-necessary'
    security-updates: true

  - package-ecosystem: 'npm'
    directory: '/packages/cli'
    schedule:
      interval: 'weekly'
      day: 'wednesday'
      time: '11:00'
      timezone: 'UTC'
    open-pull-requests-limit: 3
    commit-message:
      prefix: 'deps'
      include: 'scope'
    labels:
      - 'dependencies'
      - 'npm'
      - 'cli'
      - 'automated-update'
    versioning-strategy: 'increase-if-necessary'
    security-updates: true

  # GitHub Actions updates
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'thursday'
      time: '09:00'
      timezone: 'UTC'
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'ci'
      include: 'scope'
    labels:
      - 'dependencies'
      - 'github-actions'
      - 'ci'
      - 'automated-update'
    reviewers:
      - 'dependabot[bot]'
    assignees:
      - 'dependabot[bot]'

# Global settings
registries:
  # Configure any private registries if needed
  # Example for private npm registry:
  # npm-private:
  #   type: 'npm-registry'
  #   url: 'https://registry.private.com'
  #   username: ${{ secrets.NPM_PRIVATE_USERNAME }}
  #   password: ${{ secrets.NPM_PRIVATE_PASSWORD }}