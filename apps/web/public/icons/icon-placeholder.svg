<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="512" height="512" fill="#1a1a1a"/>

  <!-- Gundam-style mecha head silhouette -->
  <g transform="translate(256, 256)">
    <!-- Main head -->
    <rect x="-60" y="-80" width="120" height="100" fill="#dc2626" rx="8"/>

    <!-- V-fin -->
    <polygon points="-40,-80 0,-120 40,-80 20,-80 0,-100 -20,-80" fill="#dc2626"/>

    <!-- Eyes/Glowing parts -->
    <rect x="-20" y="-50" width="15" height="8" fill="#ff4444" rx="2"/>
    <rect x="5" y="-50" width="15" height="8" fill="#ff4444" rx="2"/>

    <!-- Face vents -->
    <rect x="-30" y="-30" width="8" height="20" fill="#333" rx="2"/>
    <rect x="22" y="-30" width="8" height="20" fill="#333" rx="2"/>

    <!-- Chin guard -->
    <rect x="-25" y="10" width="50" height="10" fill="#b91c1c" rx="4"/>
  </g>

  <!-- Decorative elements -->
  <circle cx="80" cy="80" r="6" fill="#dc2626" opacity="0.6"/>
  <circle cx="432" cy="80" r="6" fill="#dc2626" opacity="0.6"/>
  <circle cx="80" cy="432" r="6" fill="#dc2626" opacity="0.6"/>
  <circle cx="432" cy="432" r="6" fill="#dc2626" opacity="0.6"/>
</svg>